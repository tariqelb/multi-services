<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Article">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.55" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3A8A" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#93C5FD" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <circle cx="1120" cy="120" r="190" fill="#BFDBFE" opacity="0.55"/>
  <circle cx="140" cy="640" r="230" fill="#E0E7FF" opacity="0.8"/>

  <!-- Paper -->
  <g filter="url(#shadow)">
    <rect x="420" y="150" width="440" height="460" rx="28" fill="#FFFFFF"/>
  </g>
  <path d="M800 150 h32 a28 28 0 0 1 28 28 v32 z" fill="#DBEAFE"/>

  <!-- House on the paper -->
  <g transform="translate(470 205)">
    <rect x="0" y="0" width="340" height="170" rx="18" fill="#EFF6FF"/>
    <path d="M110 92 L170 44 L230 92" fill="none" stroke="url(#roof)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="88" width="84" height="62" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="8"/>
    <rect x="160" y="112" width="20" height="38" rx="3" fill="#2563EB"/>
    <circle cx="276" cy="52" r="18" fill="#FBBF24" opacity="0.9"/>
  </g>

  <!-- Text lines -->
  <rect x="470" y="410" width="280" height="18" rx="9" fill="#1E3A8A" opacity="0.85"/>
  <rect x="470" y="450" width="340" height="12" rx="6" fill="#94A3B8" opacity="0.7"/>
  <rect x="470" y="478" width="320" height="12" rx="6" fill="#94A3B8" opacity="0.6"/>
  <rect x="470" y="506" width="250" height="12" rx="6" fill="#94A3B8" opacity="0.5"/>
  <rect x="470" y="546" width="110" height="28" rx="14" fill="#2563EB" opacity="0.14"/>
</svg>
